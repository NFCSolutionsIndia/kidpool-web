<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330">
  <!-- KidPool brand-only palette: ink #14171A, lime #CBF34B, white, and greens mixed from ink+lime -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".72" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="m"><rect width="640" height="330" fill="url(#fade)"/></mask>
    <radialGradient id="sun" cx=".78" cy=".18" r=".55">
      <stop offset="0" stop-color="#F4FFD0" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#CBF34B" stop-opacity=".45"/>
      <stop offset="1" stop-color="#CBF34B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA83C"/><stop offset="1" stop-color="#55692A"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E7330"/><stop offset="1" stop-color="#2E3820"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2FF7A"/><stop offset="1" stop-color="#B5DC2E"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <symbol id="tree" viewBox="-20 -46 40 50">
      <rect x="-2.5" y="-10" width="5" height="14" rx="2" fill="#14171A"/>
      <circle cy="-24" r="17" fill="currentColor"/>
      <circle cx="-6" cy="-29" r="6" fill="#fff" opacity=".28"/>
    </symbol>
  </defs>

  <g mask="url(#m)">
    <!-- sky glow -->
    <rect width="640" height="330" fill="url(#sun)"/>

    <!-- far hills -->
    <path d="M0 150 C 90 108, 170 120, 250 138 S 420 96, 520 112 S 610 128, 640 120 V330 H0Z" fill="url(#hillA)" opacity=".75"/>
    <!-- near ground -->
    <path d="M0 198 C 110 170, 220 182, 330 196 S 540 168, 640 180 V330 H0Z" fill="url(#hillB)"/>

    <!-- school on the hill (top right) -->
    <g transform="translate(470 92)">
      <ellipse cx="34" cy="48" rx="58" ry="9" fill="#14171A" opacity=".25"/>
      <rect x="0" y="12" width="70" height="36" rx="4" fill="#fff"/>
      <path d="M-6 14 L35 -6 L76 14 Z" fill="#14171A"/>
      <rect x="27" y="-14" width="16" height="16" rx="3" fill="#fff"/>
      <circle cx="35" cy="-6" r="4.5" fill="#CBF34B" stroke="#14171A" stroke-width="1.5"/>
      <rect x="8" y="20" width="12" height="10" rx="2" fill="#CBF34B"/>
      <rect x="50" y="20" width="12" height="10" rx="2" fill="#CBF34B"/>
      <rect x="29" y="28" width="12" height="20" rx="2" fill="#14171A"/>
      <line x1="62" y1="-6" x2="62" y2="-34" stroke="#14171A" stroke-width="2"/>
      <path d="M62 -34 h16 l-4 6 4 6 h-16z" fill="#CBF34B"/>
    </g>

    <!-- road: wide ink band with lime edges and white dashes -->
    <path id="road" d="M-20 300 C 90 300, 140 220, 250 214 S 420 210, 470 168 S 560 130, 660 128"
          fill="none" stroke="#14171A" stroke-width="34" stroke-linecap="round"/>
    <path d="M-20 300 C 90 300, 140 220, 250 214 S 420 210, 470 168 S 560 130, 660 128"
          fill="none" stroke="#CBF34B" stroke-width="38" stroke-linecap="round" opacity=".22"/>
    <path d="M-20 300 C 90 300, 140 220, 250 214 S 420 210, 470 168 S 560 130, 660 128"
          fill="none" stroke="#14171A" stroke-width="32" stroke-linecap="round"/>
    <path d="M-20 300 C 90 300, 140 220, 250 214 S 420 210, 470 168 S 560 130, 660 128"
          fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="12 12" stroke-linecap="round"/>

    <!-- houses along the road -->
    <g transform="translate(70 196)">
      <ellipse cx="22" cy="40" rx="34" ry="6" fill="#14171A" opacity=".3"/>
      <rect x="0" y="12" width="44" height="28" rx="3" fill="#fff"/>
      <path d="M-5 14 L22 -6 L49 14 Z" fill="#CBF34B"/>
      <rect x="17" y="24" width="10" height="16" rx="2" fill="#14171A"/>
    </g>
    <g transform="translate(300 150)">
      <ellipse cx="20" cy="38" rx="30" ry="5" fill="#14171A" opacity=".3"/>
      <rect x="0" y="12" width="40" height="26" rx="3" fill="#fff"/>
      <path d="M-5 14 L20 -5 L45 14 Z" fill="#14171A"/>
      <rect x="6" y="20" width="9" height="8" rx="1.5" fill="#CBF34B"/>
      <rect x="25" y="23" width="9" height="15" rx="2" fill="#14171A"/>
    </g>
    <g transform="translate(372 236)">
      <ellipse cx="24" cy="42" rx="36" ry="6" fill="#14171A" opacity=".35"/>
      <rect x="0" y="12" width="48" height="30" rx="3" fill="#fff"/>
      <path d="M-6 14 L24 -8 L54 14 Z" fill="#CBF34B"/>
      <rect x="8" y="22" width="10" height="9" rx="1.5" fill="#14171A"/>
      <rect x="30" y="25" width="10" height="17" rx="2" fill="#14171A"/>
    </g>

    <!-- trees -->
    <use href="#tree" x="180" y="150" width="34" height="42" color="#CBF34B"/>
    <use href="#tree" x="212" y="160" width="26" height="32" color="#EEFBC4"/>
    <use href="#tree" x="420" y="120" width="30" height="38" color="#CBF34B"/>
    <use href="#tree" x="560" y="160" width="36" height="45" color="#EEFBC4"/>
    <use href="#tree" x="20" y="150" width="30" height="38" color="#EEFBC4"/>
    <use href="#tree" x="268" y="250" width="40" height="50" color="#CBF34B"/>
    <use href="#tree" x="590" y="96" width="24" height="30" color="#CBF34B"/>

    <!-- headlight glow + lime car on the road -->
    <ellipse cx="300" cy="214" rx="46" ry="12" fill="#F4FFD0" opacity=".35" filter="url(#soft)"/>
    <g transform="translate(222 190) rotate(-2)">
      <ellipse cx="34" cy="34" rx="40" ry="6" fill="#000" opacity=".35"/>
      <rect x="0" y="10" width="68" height="22" rx="9" fill="url(#carBody)" stroke="#14171A" stroke-width="2"/>
      <rect x="14" y="-2" width="36" height="16" rx="6" fill="#fff" stroke="#14171A" stroke-width="2"/>
      <rect x="20" y="1" width="11" height="9" rx="2" fill="#14171A" opacity=".85"/>
      <rect x="34" y="1" width="11" height="9" rx="2" fill="#14171A" opacity=".85"/>
      <circle cx="15" cy="32" r="7.5" fill="#14171A"/><circle cx="15" cy="32" r="3" fill="#EEFBC4"/>
      <circle cx="53" cy="32" r="7.5" fill="#14171A"/><circle cx="53" cy="32" r="3" fill="#EEFBC4"/>
      <circle cx="66" cy="18" r="3" fill="#FFFBE0"/>
    </g>

    <!-- map pins: pickup (white) and drop-off (lime) -->
    <g transform="translate(120 222)">
      <ellipse cx="0" cy="34" rx="10" ry="3" fill="#000" opacity=".3"/>
      <path d="M0 32 C -14 14, -16 6, -16 0 A16 16 0 0 1 16 0 C 16 6, 14 14, 0 32Z" fill="#fff" stroke="#14171A" stroke-width="2"/>
      <circle r="6" fill="#14171A"/>
    </g>
    <g transform="translate(540 72)">
      <ellipse cx="0" cy="34" rx="10" ry="3" fill="#000" opacity=".3"/>
      <path d="M0 32 C -14 14, -16 6, -16 0 A16 16 0 0 1 16 0 C 16 6, 14 14, 0 32Z" fill="#CBF34B" stroke="#14171A" stroke-width="2"/>
      <circle r="6" fill="#14171A"/>
    </g>

    <!-- seat-offered chat bubble -->
    <g transform="translate(330 96)">
      <rect x="0" y="0" width="112" height="34" rx="17" fill="#fff"/>
      <path d="M22 33 l-6 12 16 -12z" fill="#fff"/>
      <circle cx="18" cy="17" r="9" fill="#CBF34B"/>
      <path d="M14 17 l3 3 6 -6" fill="none" stroke="#14171A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="34" y="11" width="58" height="5" rx="2.5" fill="#14171A"/>
      <rect x="34" y="20" width="40" height="4" rx="2" fill="#14171A" opacity=".35"/>
    </g>

    <!-- sparkles -->
    <g fill="#fff">
      <circle cx="60" cy="70" r="2" opacity=".7"/><circle cx="260" cy="60" r="1.6" opacity=".6"/>
      <circle cx="610" cy="40" r="2" opacity=".8"/><circle cx="420" cy="54" r="1.4" opacity=".6"/>
    </g>
  </g>
</svg>
